<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b"><title>BETTER — Feedback</title><link rel="stylesheet" href="styles.css"></head><body><main class="legal"><a class="logo" href="/">BETTER</a><span class="eyebrow">Public beta</span><h1>Help make BETTER better.</h1><p>Tell us what worked, what was confusing, or what you want BETTER to do next.</p><form class="field" action="mailto:feedback@better.app" method="post" enctype="text/plain"><label>Your feedback</label><textarea name="feedback" required placeholder="What should we improve?"></textarea><label>Contact email (optional)</label><input name="email" type="email" placeholder="you@example.com"><button class="primary" type="submit">Send feedback</button></form><p class="muted">The MVP currently opens your email app rather than storing feedback in a database.</p><a class="secondary" href="/">Back to BETTER</a></main></body></html>
